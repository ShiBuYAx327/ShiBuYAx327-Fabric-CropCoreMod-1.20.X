<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สมัครสมาชิก - CropCoreMod Shop</title>
    <style>
        body {
            background: #0b0f10;
            color: #eee;
            font-family: Tahoma, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        
        .register-box {
            background: #fff;
            color: #000;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
            width: 340px;
            text-align: center;
        }
        
        input,
        select {
            width: 90%;
            padding: 10px;
            margin-top: 10px;
            border: none;
            border-radius: 5px;
            background: #b1b5b8;
        }
        
        button {
            width: 100%;
            margin-top: 15px;
            padding: 10px;
            border: none;
            border-radius: 8px;
            background: #fa9cfd;
            font-weight: bold;
            cursor: pointer;
        }
        
        button:hover {
            background: #38ffb3;
            color: white;
        }
    </style>
</head>

<body>
    <div class="register-box">
        <h2>สมัครสมาชิก</h2>
        <form id="registerForm">
            <input type="text" id="username" placeholder="ชื่อผู้ใช้" required>
            <input type="password" id="password" placeholder="รหัสผ่าน" required>
            <input type="password" id="confirm" placeholder="ยืนยันรหัสผ่าน" required>

            <label>เลือกประเภทผู้ใช้:</label>
            <select id="role" required>
        <option value="player">ผู้เล่นทั่วไป</option>
        <option value="seller">พ่อค้า / แม่ค้า</option>
      </select>

            <button type="submit">สมัครสมาชิก</button>
            <p id="message"></p>
            <p>มีบัญชีแล้ว? <a href="login.html">เข้าสู่ระบบ</a></p>
        </form>
    </div>

    <script>
        document.getElementById("registerForm").addEventListener("submit", async(e) => {
            e.preventDefault();

            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value.trim();
            const confirm = document.getElementById("confirm").value.trim();
            const role = document.getElementById("role") ? document.getElementById("role").value : "player";
            const msg = document.getElementById("message");

            if (password !== confirm) {
                msg.style.color = "red";
                msg.textContent = "รหัสผ่านไม่ตรงกัน!";
                return;
            }

            const res = await fetch("http://127.0.0.1:3000/register", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    username,
                    password,
                    role
                })
            });

            const data = await res.json();
            msg.style.color = data.success ? "green" : "red";
            msg.textContent = data.message;

            if (data.success) {
                setTimeout(() => window.location.href = "login.html", 1500);
            }
        });
    </script>
</body>

</html>
