<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CropCoreMod Shop</title>

    <style>
        body {
            font-family: Tahoma, sans-serif;
            background: #000;
            color: #fff;
            margin: 0;
            text-align: center;
        }
        
        header {
            padding: 20px;
            background: #111;
        }
        
        .shop-name {
            font-size: 32px;
            color: #f92ef9;
            margin: 0;
        }
        
        .items {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            padding: 20px;
            max-width: 1000px;
            margin: auto;
        }
        
        .item {
            background: #1a1a1a;
            border-radius: 8px;
            padding: 10px;
            box-shadow: 0 0 5px rgba(255, 255, 255, 0.2);
        }
        
        .item h3 {
            color: #fff;
            margin: 10px 0 5px 0;
        }
        
        .item p {
            color: #ccc;
            margin: 5px 0;
        }
        
        button {
            background: #f92ef9;
            border: none;
            color: #000;
            font-weight: bold;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }
        
        button:hover {
            background: #38ffb3;
            color: #000;
        }
        
        #codeResult {
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <header>
        <div class="shop-name">CropCoreMod Shop</div>
        <p>สวัสดีงับอ้วง <span id="userName"></span></p>
    </header>

    <div id="codeResult" style="display:none;"></div>

    <div class="items" id="items">
        <p>กำลังโหลดข้อมูลสินค้าน้าา...</p>
    </div>

    <script>
        const username = localStorage.getItem("username");
        const role = localStorage.getItem("role");
        const user_id = localStorage.getItem("user_id");

        let roleDisplay = "ไม่ระบุ";
        if (role === "player") roleDisplay = "ผู้เล่น";
        else if (role === "seller") roleDisplay = "ผู้ขาย";

        document.getElementById("userName").textContent = `${username || "ผู้ใช้ทั่วไป"} (${roleDisplay})`;
        if (!user_id) {
            document.getElementById("userName").textContent = "";
        }
        if (role === "seller") {
            const header = document.querySelector("header");
            const addBtn = document.createElement("button");
            addBtn.textContent = "เพิ่มสินค้า";
            addBtn.style.marginLeft = "10px";
            addBtn.style.background = "#38ffb3";
            addBtn.style.border = "none";
            addBtn.style.borderRadius = "6px";
            addBtn.style.padding = "6px 12px";
            addBtn.style.cursor = "pointer";


            header.appendChild(addBtn);
        }
        fetch("http://127.0.0.1:3000/items")
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById("items");
                container.innerHTML = "";
                data.forEach(item => {
                    container.innerHTML += `
            <div class="item">
              <h3>${item.name}</h3>
              <p>ราคา: ${item.price} บาท</p>
              <button onclick="orderItem(${item.id})">โปรดสั่งเสียก่อนสั้งซื้อสั่งซื้อ</button>
            </div>
          `;
                });
            });

        async function orderItem(item_id) {
            const res = await fetch("http://127.0.0.1:3000/order", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    user_id,
                    item_id
                })
            });

            const data = await res.json();
            if (data.success) {
                document.getElementById("codeResult").style.display = "block";
                document.getElementById("codeResult").innerHTML = `
          <h3>สั่งซื้อสำเร็จแล้วย๊าาหู้วว!!!</h3>
          <p>รหัสของคุณคือนี้น้าาเอาไปใช้ได้เลยย:</p>
          <h2 style="color:#38ffb3;">${data.code}</h2>
        `;
            } else {
                alert(data.message);
            }
        }
    </script>
</body>

</html>
