<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - CropCoreMod Shop</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background: #0b0f10;
            color: #eee;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        
        .login-box {
            background: #fff;
            color: #000;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
            width: 320px;
            text-align: center;
        }
        
        .shop-name {
            font-size: 28px;
            color: #f92ef9;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.3);
            margin-bottom: 15px;
            font-weight: bold;
        }
        
        h2 {
            margin-bottom: 20px;
            color: #fa9cfd;
        }
        
        label {
            display: block;
            text-align: left;
            margin-top: 10px;
            font-size: 14px;
            color: #333;
        }
        
        input {
            width: 90%;
            padding: 10px;
            margin-top: 8px;
            border: none;
            border-radius: 5px;
            background: #b1b5b8;
            color: #000;
            font-size: 14px;
        }
        
        input::placeholder {
            color: #333;
        }
        
        button {
            width: 100%;
            margin-top: 20px;
            padding: 10px;
            border: none;
            border-radius: 8px;
            background: #fa9cfd;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        
        button:hover {
            background: #38ffb3;
            color: white;
        }
        
        p {
            color: #555;
            font-size: 14px;
            margin-top: 15px;
        }
        
        a {
            color: #f92ef9;
            text-decoration: none;
        }
        
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="login-box">
        <div class="shop-name">CropCoreMod Shop</div>
        <h2>เข้าสู่ระบบ</h2>
        <form id="loginForm">
            <label>ชื่อผู้ใช้</label>
            <input type="text" id="username" placeholder="เช่น Steve" required>

            <label>รหัสผ่าน</label>
            <input type="password" id="password" placeholder="••••••••" required>

            <button type="submit">เข้าสู่ระบบ</button>
        </form>

        <p id="message"></p>
        <p>ยังไม่มีบัญชี? <a href="register.html">สมัครสมาชิก</a></p>
    </div>

    <script>
        document.getElementById("loginForm").addEventListener("submit", async(e) => {
            e.preventDefault();

            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;
            const msg = document.getElementById("message");

            const res = await fetch("http://127.0.0.1:3000/login", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    username,
                    password
                })
            });

            const data = await res.json();

            if (data.success) {
                localStorage.setItem("user_id", data.user.id);
                localStorage.setItem("username", data.user.username);
                localStorage.setItem("role", data.user.role);
                msg.style.color = "green";
                msg.textContent = "เข้าสู่ระบบสำเร็จ! กำลังไปยังร้านค้า...";
                setTimeout(() => window.location.href = "shop.html", 1000);
            } else {
                msg.style.color = "red";
                msg.textContent = data.message || "ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง";
            }

        });
    </script>

</body>

</html>
